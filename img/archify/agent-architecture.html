<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>中药鉴别智能体协同架构</title>
  <style>
    :root{--bg:#07101b;--panel:#0d1926;--line:#2a4658;--text:#e8f2f5;--muted:#8ca4b0;--cyan:#4de4e8;--orange:#ef6a36;--green:#5ad39c;--blue:#65a7ff;--violet:#ba8cff;--gold:#e7bb62}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:12px/1.4 Inter,"Microsoft YaHei",sans-serif}body:before{content:"";position:fixed;inset:0;background:linear-gradient(rgba(102,165,190,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(102,165,190,.07) 1px,transparent 1px);background-size:34px 34px;mask-image:radial-gradient(ellipse at center,#000 25%,transparent 84%);pointer-events:none}.stage{position:relative;width:100%;height:100%;padding:18px}.legend{position:absolute;z-index:4;top:14px;left:18px;display:flex;align-items:center;gap:10px;color:var(--muted);font-size:10px;letter-spacing:.08em}.live{display:inline-flex;align-items:center;gap:6px;color:var(--cyan);font-weight:700}.live i{width:6px;height:6px;border-radius:50%;background:var(--cyan);box-shadow:0 0 14px var(--cyan);animation:pulse 1.8s ease-in-out infinite}@keyframes pulse{50%{opacity:.35;transform:scale(.7)}}.scene-title{position:absolute;z-index:4;top:16px;right:18px;text-align:right;color:#b9cbd3}.scene-title strong{display:block;color:#fff;font-size:13px}.scene-title span{font-size:10px;color:var(--muted)}.graph{position:absolute;inset:54px 16px 56px}.edges{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.edges path{fill:none;stroke:var(--line);stroke-width:1.2;opacity:.65;stroke-dasharray:4 5}.edges path.active{stroke:var(--cyan);stroke-width:2;opacity:.95;stroke-dasharray:10 8;animation:flow 2.4s linear infinite}@keyframes flow{to{stroke-dashoffset:-36}}.node{position:absolute;z-index:2;min-width:124px;padding:10px 12px;border:1px solid rgba(125,177,198,.38);border-radius:7px;background:rgba(13,25,38,.92);box-shadow:0 8px 22px rgba(0,0,0,.22);cursor:pointer;transition:.25s ease}.node:hover,.node.selected{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 0 24px rgba(77,228,232,.22);transform:translateY(-2px)}.node b{display:block;color:#edf8fa;font-size:11px;font-weight:600}.node small{display:block;margin-top:3px;color:var(--muted);font-size:9px}.node.root{left:35%;top:40%;min-width:190px;border-color:var(--orange);background:linear-gradient(135deg,rgba(86,34,21,.94),rgba(13,25,38,.96));text-align:center}.node.root b{color:#ffd2bf;font-size:13px}.node.input{left:0;top:43%;border-color:var(--green)}.node.profile{left:8%;top:9%;border-color:var(--green)}.node.route{left:8%;top:76%;border-color:var(--blue)}.node.resource{left:67%;top:8%;border-color:var(--violet)}.node.evidence{left:67%;top:40%;border-color:var(--cyan)}.node.review{left:67%;top:76%;border-color:var(--gold)}.node.feedback{right:1%;left:auto;top:43%;border-color:var(--orange)}.node.group{min-width:128px}.node.group b:before{content:"";display:inline-block;width:6px;height:6px;margin:0 6px 1px 0;border-radius:50%;background:currentColor}.node.profile b{color:var(--green)}.node.route b{color:var(--blue)}.node.resource b{color:var(--violet)}.node.evidence b{color:var(--cyan)}.node.review b{color:var(--gold)}.node.feedback b{color:var(--orange)}.signal{position:absolute;z-index:3;width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px var(--cyan);offset-rotate:0deg;animation:signal 4.8s linear infinite}@keyframes signal{0%{left:6%;top:48%;opacity:0}8%{opacity:1}35%{left:39%;top:48%}62%{left:68%;top:48%}88%{left:88%;top:48%;opacity:1}100%{left:94%;top:48%;opacity:0}}.detail{position:absolute;z-index:5;left:18px;right:18px;bottom:12px;display:flex;align-items:center;gap:12px;padding:9px 12px;border-top:1px solid rgba(125,177,198,.2);color:var(--muted);background:rgba(7,16,27,.72)}.detail strong{color:#fff;font-size:11px}.detail span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.status{margin-left:auto;color:var(--green);font-family:ui-monospace,monospace;font-size:10px;white-space:nowrap}@media(max-width:620px){.stage{padding:10px}.graph{inset:46px 4px 58px}.node{min-width:76px;max-width:88px;padding:7px 6px}.node b{font-size:8px;line-height:1.2}.node small{font-size:7px;line-height:1.2}.node.root{left:31%;top:43%;min-width:108px;max-width:118px}.node.input{left:0;top:44%;min-width:76px}.node.profile{left:2%;top:7%}.node.route{left:2%;top:80%}.node.resource{left:61%;top:7%}.node.evidence{left:61%;top:42%}.node.review{left:61%;top:80%}.node.feedback{left:auto;right:0;top:44%;min-width:70px;max-width:76px}.scene-title{right:8px}.legend{left:8px;max-width:58%;gap:6px;font-size:8px}.detail{left:6px;right:6px;bottom:6px;padding:8px}.detail strong{font-size:9px}.detail span{font-size:8px}.status{display:none}}
  </style>
  <style>
    .node.scene-focus{box-shadow:0 0 0 1px currentColor,0 0 26px rgba(77,228,232,.34);transform:translateY(-1px)}
    @keyframes signalProfile{0%{left:6%;top:48%;opacity:0}10%{opacity:1}34%{left:24%;top:28%}58%{left:39%;top:48%}82%{left:24%;top:70%;opacity:1}100%{left:6%;top:48%;opacity:0}}
    @keyframes signalRoute{0%{left:39%;top:48%;opacity:0}10%{opacity:1}38%{left:24%;top:70%}68%{left:67%;top:76%}90%{left:88%;top:48%;opacity:1}100%{left:39%;top:48%;opacity:0}}
    body[data-scene="profile"] .signal{background:var(--green);box-shadow:0 0 12px var(--green);animation-name:signalProfile}
    body[data-scene="route"] .signal{background:var(--blue);box-shadow:0 0 12px var(--blue);animation-name:signalRoute}
  </style>
</head>
<body>
  <main class="stage">
    <div class="legend"><span class="live"><i></i>协同运行</span><span>总控调度 · 多智能体协作 · 证据回写</span></div>
    <div class="scene-title"><strong id="title">个性化资源生成</strong><span>基于平台智能体配置的协同流程示意</span></div>
    <section class="graph" aria-label="中药鉴别智能体协同架构">
      <svg class="edges" viewBox="0 0 1000 600" preserveAspectRatio="none" aria-hidden="true">
        <path class="active" d="M65 290 C220 290 280 260 390 270"/><path class="active" d="M250 120 C320 180 340 230 410 270"/><path d="M250 470 C330 430 350 330 410 300"/><path class="active" d="M560 270 C660 180 690 150 760 130"/><path class="active" d="M560 300 C660 300 700 300 760 300"/><path d="M560 330 C650 390 700 450 760 460"/><path class="active" d="M820 300 C880 300 900 300 940 300"/><path d="M760 475 C830 430 870 360 940 320"/>
      </svg>
      <button class="node input" data-detail="学习者提交目标、图片、文档或一段对话，作为协同任务的起点。"><b>学习者输入</b><small>目标 · 图片 · 文档</small></button>
      <button class="node group profile" data-detail="采集学习背景并更新学习画像，为后续规划提供可追溯证据。"><b>学习理解组</b><small>3 个智能体</small></button>
      <button class="node group route" data-detail="根据画像与目标拆解长期路径和每周任务，并持续接收学习反馈。"><b>路径规划组</b><small>4 个智能体</small></button>
      <button class="node root" data-detail="岐小智总控智能体读取共享黑板，选择专业能力并汇总结构化结果。"><b>岐小智总控智能体</b><small>Supervisor · 共享黑板</small></button>
      <button class="node group resource" data-detail="题库、讲义、思维导图、视频与动画智能体按任务并行生成学习资源。"><b>资源生成组</b><small>6 个智能体 · 并行执行</small></button>
      <button class="node group evidence" data-detail="多模态证据智能体与文档解析智能体，把图片、音频和资料转成可核验信息。"><b>证据理解组</b><small>3 个运行时智能体</small></button>
      <button class="node group review" data-detail="结构化输出经过 Skill 契约校验、安全审核，并将结果写回任务状态。"><b>审核与证据</b><small>契约 · 安全 · 回写</small></button>
      <button class="node feedback" data-detail="结果返回学习者，同时沉淀为下一轮画像和路径调整依据。"><b>学习结果</b><small>资源 · 反馈 · 调整</small></button>
    </section>
    <footer class="detail"><strong id="detail-title">当前流程：目标进入总控</strong><span id="detail-copy">总控读取画像并分派路径规划、资源调度和证据理解任务。</span><span class="status">8 个节点参与 · 3 项审核</span></footer>
  </main>
  <script>
    const titles={profile:['学习画像构建','画像采集 · 背景分析 · 证据归纳'],route:['个性化路径规划','目标拆解 · 周任务编排 · 反馈调整'],resource:['个性化资源生成','目标拆解 · 资源编排 · 多模态生成']};
    const params=new URLSearchParams(location.search); const scene=params.get('scene')||'resource'; const title=document.getElementById('title'); if(titles[scene]){title.textContent=titles[scene][0];document.querySelector('.scene-title span').textContent=titles[scene][1]+' · 协同流程示意'}
    const activeByScene={resource:[0,1,3,4,6],profile:[1,2,4,5],route:[0,2,5,7]}; const focusByScene={resource:['resource','evidence'],profile:['profile','route'],route:['route','review']}; const activeEdges=activeByScene[scene]||activeByScene.resource; document.querySelectorAll('.edges path').forEach((path,index)=>path.classList.toggle('active',activeEdges.includes(index))); (focusByScene[scene]||focusByScene.resource).forEach(name=>document.querySelector('.node.'+name)?.classList.add('scene-focus'));
    const detailTitle=document.getElementById('detail-title'),detailCopy=document.getElementById('detail-copy'); document.querySelectorAll('.node').forEach(node=>node.addEventListener('click',()=>{document.querySelectorAll('.node').forEach(n=>n.classList.remove('selected'));node.classList.add('selected');detailTitle.textContent=node.querySelector('b').textContent;detailCopy.textContent=node.dataset.detail}));
  </script>
</body>
</html>
