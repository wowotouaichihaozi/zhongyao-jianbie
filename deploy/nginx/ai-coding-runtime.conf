# Included inside the lzhan.xyz TLS server block.
location = /_ai_coding_auth {
    internal;
    proxy_pass http://127.0.0.1:3000/api/auth/me;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Original-URI $request_uri;
}

location = /ai-coding-runtime {
    return 302 /ai-coding-runtime/;
}

# The shared-workspace uploader is a Harness plugin endpoint. It is kept at
# its native root path but remains behind the platform login check.
location = /_dsh/attachment-upload/upload {
    auth_request /_ai_coding_auth;
    client_max_body_size 64m;

    proxy_pass http://127.0.0.1:13080;
    proxy_http_version 1.1;
    proxy_set_header Host lzhan.xyz;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
}

# Harness transports RPC through these dedicated endpoints. Keeping them at
# their native root paths preserves the plugin module and RPC identifiers.
location ~ ^/api/(respond|events\.host|events\.mux|session\.export|commands/(list|execute)|dynamicCordisRunner/) {
    auth_request /_ai_coding_auth;

    proxy_pass http://127.0.0.1:13080;
    proxy_http_version 1.1;
    proxy_set_header Host lzhan.xyz;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 660s;
    proxy_send_timeout 660s;
    proxy_buffering off;
    proxy_request_buffering off;
}

location ^~ /ai-coding-runtime/ {
    auth_request /_ai_coding_auth;

    rewrite ^/ai-coding-runtime/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:13080;
    proxy_http_version 1.1;
    proxy_set_header Host lzhan.xyz;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /ai-coding-runtime;
    proxy_set_header Accept-Encoding "";
    proxy_read_timeout 660s;
    proxy_send_timeout 660s;
    proxy_buffering off;
    proxy_request_buffering off;

    sub_filter_once off;
    sub_filter_types application/javascript text/javascript;
    sub_filter '"/plugins/' '"/ai-coding-runtime/plugins/';
    sub_filter '"/assets/' '"/ai-coding-runtime/assets/';
    sub_filter 'href="/manifest.webmanifest"' 'href="/ai-coding-runtime/manifest.webmanifest"';
    sub_filter 'href="/favicon.svg"' 'href="/ai-coding-runtime/favicon.svg"';
    sub_filter '"/api/' '"/ai-coding-runtime/api/';
    sub_filter "'/api/" "'/ai-coding-runtime/api/";
    sub_filter '`/api/' '`/ai-coding-runtime/api/';
    sub_filter '"/plugins/events"' '"/ai-coding-runtime/plugins/events"';
    sub_filter "'/plugins/events'" "'/ai-coding-runtime/plugins/events'";
    sub_filter '`/plugins/events`' '`/ai-coding-runtime/plugins/events`';

    # The host platform already identifies the active shared workspace. Remove
    # Harness' duplicate session header and tabs from the embedded page.
    sub_filter '</head>' '<style id="lzhan-ai-coding-clean-header">header:has(nav[aria-label="会话层级"]){display:none!important}</style></head>';

    # Remote Harness clients intentionally cannot read host settings. Remove
    # only the internal-testing notice component while leaving credentials and
    # settings APIs blocked for non-loopback users.
    sub_filter '}, WelcomeNotice));' '}, () => null));';
}
