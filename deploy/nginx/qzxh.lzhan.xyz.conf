server {
    listen 80;
    server_name qzxh.lzhan.xyz;

    root /var/www/qzxh/frontend/dist;
    index index.html;
    client_max_body_size 256m;
    add_header X-QZXH-Origin "47.103.155.248" always;

    location /ppt-api/ {
        proxy_pass http://127.0.0.1:8865/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 660s;
        proxy_send_timeout 660s;
        proxy_buffering off;
    }

    location /api {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 660s;
        proxy_send_timeout 660s;
        client_max_body_size 256m;
    add_header X-QZXH-Origin "47.103.155.248" always;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
    }

    location ~ ^/(api-bili|api-cover|api-mimo) {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 660s;
        proxy_send_timeout 660s;
        proxy_buffering off;
    }

    location = /m {
        return 301 /m/;
    }

    location ^~ /m/ {
        alias /var/www/qzxh/mobile/dist/;
        index index.html;
        try_files $uri $uri/ /m/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /admin {
        return 301 /admin/;
    }

    location ^~ /admin/ {
        alias /var/www/qzxh/admin/dist/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    location = /ppt {
        return 301 /ppt/;
    }

    location ^~ /ppt/ {
        alias /var/www/qzxh/frontend/dist/ppt/;
        index index.html;
        try_files $uri $uri/ /ppt/index.html;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    include /etc/nginx/snippets/qzxh-ai-coding-runtime.conf;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
}
